:root.ciemny{--tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;--tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;--akcja:#5DFF8A;--naAkcji:#052012;--wolne:#5DFF8A;--pelne:#FFC85C;--zaduzo:#FF7A7A;--moc:#7CC0FF;--aktywny:#EEF4F0;--naAktywnym:#0B0F0D;--nieaktywny:#C9D6CF;--cien:rgba(0,0,0,.5);--wylaczony:#1F2924;--naWylaczonym:#85948B;--okTlo:#14241B;--okRamka:#2F6B47;--okTekst:#8CF5B0;--uwTlo:#2A2213;--uwRamka:#6E5422;--uwTekst:#FFD27A;--blTlo:#2A1616;--blRamka:#5C2B2B;--blTekst:#FF9B9B;--mocTlo:#15283D;--mocRamka:#2B4C70;--mocTekst:#9CCFFF;--zaslona:rgba(0,0,0,.62);--R:#E3A882;--F:#9CC7A6;--T:#8DB6E0;--zM:#E7C26E;--zB:#B9B3DE;--mTab:#B4A5FF;--mMag:#F0B25A;--mRap:#7CB7FF;--mMan:#5DFF8A;--mTra:#8DB6E0;--mObe:#D7A6EA;--mHar:#7FD6D6;color-scheme:dark}
:root.jasny{color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--tlo);color:var(--tekst);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
button:disabled,button[aria-disabled="true"]{cursor:default}
button:active:not(:disabled):not([aria-disabled="true"]){filter:brightness(.93)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--moc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--tekst)}
svg{display:block;flex:0 0 auto}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
.bebas{font-family:"Bebas Neue","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Inter,sans-serif;font-weight:400;letter-spacing:.05em;line-height:1}
.etykieta{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tekst3)}
.cyfry{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ukryte{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0px)}
@keyframes wjazd{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes potrzasnij{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.potrzasnij{animation:potrzasnij .4s ease}

/* ── nagłówek ── */
.nag{flex:0 0 auto;min-height:60px;display:flex;align-items:center;gap:14px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--linia);background:var(--tlo);position:relative;z-index:5}
.nag-l{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.nag-tyt{font-size:30px;padding-top:3px;white-space:nowrap}
.pokaz-chip{font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:6px;border:1px solid var(--uwRamka);background:var(--uwTlo);color:var(--uwTekst)}
.nawig{flex:1 1 auto;min-width:0;display:flex;justify-content:center}
.nawig-w{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--pow);border:1px solid var(--ramka);max-width:100%;overflow-x:auto;scrollbar-width:none}
.nawig-w::-webkit-scrollbar{display:none}
.nawig-w button{position:relative;height:38px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:700;color:var(--nieaktywny);display:flex;align-items:center;gap:6px;white-space:nowrap}
.nawig-w button[aria-current="page"]{background:var(--aktywny);color:var(--naAktywnym)}
.licz{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--uwTlo);color:var(--uwTekst);border:1px solid var(--uwRamka);font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.nawig-w button[aria-current="page"] .licz{background:var(--naAktywnym);color:var(--aktywny);border-color:transparent}
.nag-p{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nag-czas{font-size:22px;padding-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.menu-btn{height:42px;max-width:170px;padding:0 10px 0 6px;border-radius:11px;border:1px solid var(--ramka);background:var(--pow);display:flex;align-items:center;gap:8px;min-width:0}
.menu-imie{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1320px){.nag-czas{display:none}}
@media (max-width:900px){.nag{flex-wrap:wrap;padding-top:6px;padding-bottom:6px;gap:8px 10px}.nawig{order:3;flex:1 0 100%;justify-content:flex-start}.nag-l{flex:1 1 auto}.nag-tyt{font-size:26px}}
@media (max-width:520px){.menu-imie{display:none}.menu-btn{padding:0 5px}}

/* ── awatar, chipy, przyciski ── */
.awatar{--kol:var(--tekst3);width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--pow3);border:2px solid var(--kol);color:var(--kol);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.awatar.duzy{width:56px;height:56px;flex-basis:56px;font-size:22px}
.awatar.maly{width:28px;height:28px;flex-basis:28px;font-size:12px;border-width:1.5px}
.awatar.urz{border-radius:9px}
.glowny{min-height:52px;padding:0 20px;border-radius:15px;background:var(--akcja);color:var(--naAkcji);font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.glowny.maly{min-height:44px;padding:0 16px;border-radius:12px;font-size:15px}
.glowny:disabled,.glowny[aria-disabled="true"]{background:var(--wylaczony);color:var(--naWylaczonym)}
.glowny.czerwony{background:var(--zaduzo);color:#fff}
.glowny.ciemny{background:var(--aktywny);color:var(--naAktywnym)}
.drugi{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ramka2);background:transparent;color:var(--tekst);font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center}
.drugi.maly{min-height:36px;padding:0 11px;border-radius:10px;font-size:13.5px}
.drugi.czerwony{color:var(--blTekst);border-color:var(--blRamka)}
.drugi.zielony{color:var(--okTekst);border-color:var(--okRamka)}
.drugi.uwaga{color:var(--uwTekst);border-color:var(--uwRamka);background:var(--uwTlo)}
.drugi[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym);border-color:var(--aktywny)}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--mocTekst);font-weight:700;font-size:14px;min-height:36px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:11px;background:var(--pow);border:1px solid var(--ramka)}
.seg button{min-height:34px;min-width:40px;padding:0 11px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--nieaktywny);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym)}
.seg button:disabled{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:1px 8px;border-radius:7px;border:1px solid var(--ramka2);font-size:12px;font-weight:700;color:var(--tekst2);white-space:nowrap;line-height:1.2}
.pill.ok{background:var(--okTlo);border-color:var(--okRamka);color:var(--okTekst)}
.pill.uw{background:var(--uwTlo);border-color:var(--uwRamka);color:var(--uwTekst)}
.pill.bl{background:var(--blTlo);border-color:var(--blRamka);color:var(--blTekst)}
.pill.moc{background:var(--mocTlo);border-color:var(--mocRamka);color:var(--mocTekst)}
.pill.cicha{border-style:dashed;color:var(--tekst3)}
.mb{--kol:var(--tekst3);display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 8px 2px 6px;border-radius:7px;border:1px solid var(--ramka);background:var(--pow2);font-size:12px;font-weight:700;color:var(--tekst2);white-space:nowrap}
.mb::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--kol);flex:0 0 auto}
.mb b{color:var(--tekst);font-weight:800}
.ikona{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ikona.mala{width:15px;height:15px}

/* ── układ treści ── */
.tresc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wnetrze{width:min(1180px,100%);margin:0 auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.karta{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:16px}
.karta-tyt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.karta-tyt h2{font-size:17px;font-weight:800}
.h1{font-size:26px;font-weight:800;line-height:1.2}
.pod{font-size:14px;color:var(--tekst2);max-width:70ch}
.pod b{color:var(--tekst)}
.siatka{display:grid;gap:14px}
.puste{padding:28px 16px;text-align:center;color:var(--tekst2);display:flex;flex-direction:column;align-items:center;gap:10px}

/* ── ZDZISŁAW ── */
.zdz{position:relative;display:block;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
.zdz img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.zdz.unosi img{animation:unos 3.4s ease-in-out infinite}
@keyframes unos{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.zdz.unosi::after{content:"";position:absolute;left:22%;right:22%;bottom:-2%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(111,211,255,.42),rgba(111,211,255,0));animation:pole 3.4s ease-in-out infinite;pointer-events:none}
@keyframes pole{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.zdz.wej img{animation:zdzWej .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes zdzWej{from{transform:translateY(10px) scale(.96);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.zdz.unosi img,.zdz.unosi::after,.zdz.wej img{animation:none}}
.dymek{position:relative;background:#1d1d1d;color:#e8f3ec;border:2px solid #9fe3b4;border-radius:16px;padding:12px 15px 13px;box-shadow:0 6px 22px rgba(0,0,0,.18);font-size:14.5px;line-height:1.45}
.dymek .d-tyt{font-family:"Bebas Neue","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Inter,sans-serif;letter-spacing:.07em;color:#9fe3b4;font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.dymek .d-tyt .kursor{width:8px;height:15px;background:#e2a54e;display:inline-block;animation:mrugK 1s steps(1) infinite}
@keyframes mrugK{50%{opacity:0}}
.dymek .d-pod{margin-top:7px;font-size:12px;color:#a9c9b6}
.dymek b{color:#fff}
.dymek .d-akcje{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dymek .d-akcje button{min-height:34px;padding:0 12px;border-radius:9px;border:1px solid #9fe3b4;color:#9fe3b4;font-size:13px;font-weight:800}
.dymek::after{content:"";position:absolute;width:16px;height:16px;background:#1d1d1d;border:2px solid #9fe3b4;border-top:0;border-left:0}
.dymek.ogon-dol::after{left:var(--ogon,50%);bottom:-10px;transform:translateX(-50%) rotate(45deg)}
.dymek.ogon-lewo::after{left:-10px;top:var(--ogon,40px);transform:rotate(135deg)}
.dymek.ogon-prawo::after{right:-10px;top:var(--ogon,40px);transform:rotate(-45deg)}
.dymek.wej{animation:wjazd .25s ease}

/* ── start i PIN ── */
.start{flex:1;min-height:0;overflow-y:auto}
.start-w{width:min(1040px,100%);margin:0 auto;padding:34px max(20px,env(safe-area-inset-right,0px)) 36px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.start-gora{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.start-logo{font-size:58px}
.start-pod{font-size:14px;color:var(--tekst2);display:block;margin-top:6px}
.start-pod.pokaz{color:var(--uwTekst)}
.start-uklad{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center}
.kafelki{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (min-width:640px){.kafelki{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kafel{min-height:104px;padding:12px 14px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;text-align:left}
.kafel-imie{font-size:18px;font-weight:800}
.kafel-rola{font-size:12.5px;color:var(--tekst2)}
.kafel-inna{border-style:dashed;border-color:var(--ramka2);background:transparent;color:var(--tekst2);font-size:16px;font-weight:700;align-items:center}
.start-zdz{display:flex;flex-direction:column;align-items:center;gap:14px}
.start-zdz .zdz{width:220px}
.pole{display:flex;flex-direction:column;gap:6px}
.pole input,.pole select,.pole textarea{min-height:50px;padding:0 14px;border-radius:13px;border:1px solid var(--ramka2);background:var(--pow2);font-size:17px}
.pole select{padding-right:34px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tekst2) 50%),linear-gradient(135deg,var(--tekst2) 50%,transparent 50%);background-position:calc(100% - 18px) 22px,calc(100% - 12px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.pole input:focus,.pole select:focus{border-color:var(--moc);outline:none}
.pole .blad{font-size:13px;color:var(--zaduzo);font-weight:600}
.pole .pomoc{font-size:12.5px;color:var(--tekst3)}
.pin-uklad{display:grid;grid-template-columns:minmax(0,400px) 240px;gap:40px;justify-content:center;align-items:center}
.pin{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.pin-imie{font-size:28px;font-weight:800}
.pin-pod{font-size:15px;color:var(--tekst2)}
.kropki{display:flex;gap:11px;height:22px;align-items:center}
.kropki span{width:16px;height:16px;border-radius:8px;border:2px solid var(--ramka2)}
.kropki span.p{background:var(--tekst);border-color:var(--tekst)}
.klaw-pin{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kl{height:62px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.kl.maly{font-size:15px;font-weight:700;color:var(--tekst2)}
.pin-hint{font-size:13px;color:var(--tekst2);text-align:center}
.pin-zdz{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pin-zdz .zdz{width:180px}
.pin-zdz p{font-size:13px;color:var(--tekst2);max-width:24ch}
@media (max-width:760px){.start-zdz .dymek.ogon-dol::after{left:-10px;bottom:auto;top:40px;transform:rotate(135deg)}.start-uklad{grid-template-columns:1fr}.start-zdz{flex-direction:row-reverse;align-items:flex-end}.start-zdz .zdz{width:120px}.start-zdz .dymek{flex:1}.pin-uklad{grid-template-columns:1fr;gap:12px}.pin-zdz{order:-1;flex-direction:row;gap:12px;text-align:left}.pin-zdz .zdz{width:70px}.start-logo{font-size:46px}}

/* ── pulpit ── */
.pulpit{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
.zdz-panel{position:sticky;top:0;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px}
.zdz-panel .dymek{width:100%}
.zdz-panel .zdz{width:240px;margin-top:4px}
.zdz-panel .zdz-pod{font-size:12px;color:var(--tekst3)}
.zrob{display:flex;flex-direction:column}
.zrob-w{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--linia)}
.zrob-w:first-child{border-top:0;padding-top:2px}
.zrob-ik{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--pow3);color:var(--tekst2)}
.zrob-ik.uw{background:var(--uwTlo);color:var(--uwTekst)}
.zrob-ik.moc{background:var(--mocTlo);color:var(--mocTekst)}
.zrob-ik.bl{background:var(--blTlo);color:var(--blTekst)}
.zrob-tr{flex:1;min-width:0}
.zrob-tr b{display:block;font-size:15.5px}
.zrob-tr span{font-size:13px;color:var(--tekst2)}
.liczby{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.liczba{padding:12px;border-radius:13px;background:var(--pow2);border:1px solid var(--linia);text-align:left}
.liczba b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.liczba span{font-size:12.5px;color:var(--tekst2)}
button.liczba:active{filter:brightness(.95)}
.zespoly{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.belki{display:flex;flex-direction:column;gap:9px}
.belka{display:grid;grid-template-columns:132px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13.5px}
.belka .tor{height:10px;border-radius:5px;background:var(--pow3);overflow:hidden}
.belka .tor i{display:block;height:100%;border-radius:5px;background:var(--kol)}
.belka b{text-align:right;font-variant-numeric:tabular-nums}
.belka.wkrotce{color:var(--tekst3)}
.belka.wkrotce .tor{background:repeating-linear-gradient(90deg,var(--pow3) 0 6px,transparent 6px 10px)}
.zmiany{display:flex;flex-direction:column}
.zmiana{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--linia);font-size:13.5px}
.zmiana:first-child{border-top:0;padding-top:0}
.zmiana time{color:var(--tekst3);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.zmiana small{display:block;color:var(--tekst3);font-size:12px;margin-top:1px}

}

/* ── dodatki prawdziwej wersji (logowanie przez funkcję, start kartoteki, import, stronicowanie) ── */
.ladowanie{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:340px;padding:24px;text-align:center;color:var(--tekst2)}
.ladowanie .zdz{width:150px}
.logowanie-form{display:flex;flex-direction:column;gap:14px;width:min(480px,100%)}
.logowanie-form .h1{margin:0}
.pin-hint.pin-blad{color:var(--zaduzo);font-weight:700;max-width:34ch}
.pin.wysyla .kropki span.p{animation:pinPuls .9s ease-in-out infinite}
@keyframes pinPuls{50%{opacity:.35}}
.kl:disabled{opacity:.42}
.kl.ok-kl{background:var(--akcja);color:var(--naAkcji);border-color:transparent}
.kl.ok-kl .ikona{width:28px;height:28px;stroke-width:2.6}
.kl.ok-kl:disabled{background:var(--wylaczony);color:var(--naWylaczonym)}
.pin-linki{display:flex;justify-content:space-between;gap:10px;width:100%;flex-wrap:wrap}
.brak-uklad{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:center;max-width:820px}
.brak-uklad .zdz{width:200px}
.brak-uklad > .glowny{grid-column:2;justify-self:start}
@media (max-width:640px){.brak-uklad{grid-template-columns:110px minmax(0,1fr)}.brak-uklad .zdz{width:110px}.brak-uklad .dymek.ogon-lewo::after{top:30px}}
.awatar.sys{font-family:"Bebas Neue",Inter,sans-serif;letter-spacing:.02em}
.modul-role small.osiem{display:inline-block;margin-left:3px;padding:0 5px;border-radius:6px;background:var(--uwTlo);color:var(--uwTekst);font-size:10.5px;font-weight:800;line-height:16px;vertical-align:1px}
.modul-role button[aria-pressed="true"] small.osiem{background:rgba(255,255,255,.22);color:inherit}
.uw-t{color:var(--uwTekst)!important;font-weight:700}
.m-wersja{display:block;padding:8px 16px 4px;font-size:11px;color:var(--tekst3)}
.klucz-pola .wart.pin.klucz-sys{font-size:17px;letter-spacing:.04em;word-break:break-all;line-height:1.35}
@media (max-width:520px){.klucz-pola .wart.pin.klucz-sys{font-size:14px}}
.import-karta{border-color:var(--mocRamka);background:var(--mocTlo)}
.import-karta .pod{color:var(--mocTekst)}
.imp-ustaw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.imp-ustaw .mb{cursor:pointer;min-height:34px}
.imp-ustaw .mb:disabled{opacity:.45}
.imp-lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
@media (max-width:900px){.imp-lista{grid-template-columns:1fr}}
.imp-w{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:13px;border:1px solid var(--linia);background:var(--pow2)}
.imp-w.wyl{opacity:.55}
.imp-l{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.imp-l input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--akcja)}
.imp-l .tr{display:flex;flex-direction:column;min-width:0}
.imp-l .tr b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-l .tr small{font-size:12px;color:var(--tekst3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.imp-z button{min-width:34px;padding:0 8px;font-weight:800}
.imp-sa summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.imp-sa summary::-webkit-details-marker{display:none}
.imp-sa-l{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.imp-sa-l .mb{cursor:pointer}
.stare-w select{max-width:280px}
.dymek .d-akcje button{background:transparent}
.okno.statyczne{animation:none}
@media (max-width:520px){.lista-gora .plikz{display:none}}
/* „pracuje też w” — zespoły dodatkowe (004) */
.zesp-dod{display:flex;gap:6px;flex-wrap:wrap}
.zesp-dod button{--kol:var(--tekst3);display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--ramka2);font-size:13.5px;font-weight:700;color:var(--tekst2);background:var(--pow)}
.zesp-dod button::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--kol);flex:0 0 auto}
.zesp-dod button[aria-pressed="true"]{background:var(--okTlo);color:var(--okTekst);border-color:var(--okRamka)}
.mb small.tez{font-size:11px;font-weight:700;color:var(--tekst3);margin-left:-2px}
/* dzióbek z boku dymka zawsze na prostym odcinku ramki — nie wjeżdża w zaokrąglony róg przy niskim dymku (poprawka 3.11) */
.dymek.ogon-lewo::after,.dymek.ogon-prawo::after{top:clamp(20px,var(--ogon,40px),calc(100% - 38px))}
/* Architekt (005) — złoto ponad kolorami modułów */
:root{--arch:#e8c06a;--archTlo:rgba(232,192,106,.12);--archRamka:rgba(232,192,106,.55)}
.arch{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--archRamka);background:var(--archTlo);color:var(--arch);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;vertical-align:middle}
.arch .ikona{width:14px;height:14px;stroke-width:2.2}
.arch.duza{font-size:13.5px;padding:4px 12px 4px 9px;gap:6px}
.arch.duza .ikona{width:16px;height:16px}
h2 .arch{margin-left:6px;position:relative;top:-2px}
.arch-t{color:var(--arch);font-weight:800}
.arch-pod{font-size:12px;color:var(--tekst3);margin-left:6px}
.awatar.arch-aw{box-shadow:0 0 0 2px var(--pow),0 0 0 4px var(--arch)}
.arch-info{border-color:var(--archRamka);background:var(--archTlo)}
.arch-info .ikona{color:var(--arch)}
.arch-pill{color:var(--arch);border-color:var(--archRamka);background:var(--archTlo)}
.arch-moduly{display:grid;gap:6px}
.arch-m{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--ramka);border-radius:12px;background:var(--pow2)}
.arch-m .tr{flex:1;min-width:0;display:flex;flex-direction:column}
.arch-m small{font-size:12px;color:var(--tekst3)}
.arch-m.nastepne{border-style:dashed;--kol:var(--arch)}
.arch-belka b{color:var(--arch)}
.arch-belka .tor i{background:linear-gradient(90deg,var(--archRamka),var(--arch))}
.arch-karta{border-color:var(--archRamka);background:linear-gradient(180deg,var(--archTlo),transparent 70%)}
.arch-karta h2 .arch{margin-left:0;top:0}
.arch-kto{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.arch-osoba{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:12px;border:1px solid var(--ramka);background:var(--pow)}
.arch-osoba small{color:var(--tekst3);font-size:12px}
.role-t tr.arch-w td{color:var(--arch)}
.arch-info,.arch-info span{color:var(--tekst)}
.arch-info b{color:var(--arch)}
/* kilka spisów jednej osoby (006) */
.modul-wiele{margin:6px 0 0;font-size:12.5px;color:var(--tekst3)}

</style>

function liczniki() {
  const os = osoby().filter(o => o.status !== 'odeszla');
  const zKontem = os.filter(o => o.konto && aktywna(o)).length;
  const zabl = os.filter(o => o.status === 'zablokowana').length;
  const bez = os.filter(o => !o.konto).length;
  const doKart = os.filter(doKarty).length;
  const prosby = os.filter(o => o.prosba_pin && aktywna(o) && mozeZmieniac(o));
  const doWymiany = os.filter(o => aktywna(o) && pinDoWymiany(o));
  const bezKonta = os.filter(o => aktywna(o) && !o.konto && ileDost(o.dostepy) > 0);
  const p = D.przejscie || {};
  const odeszli = osoby().filter(o => o.status === 'odeszla').length;
  return { os: os.length, zKontem, zabl, bez, doKart, prosby, doWymiany, bezKonta, odeszli, przCzeka: p.czeka || 0, przSpr: (p.sprawdz || 0) + (p.brak || 0), przPewne: p.pewne || 0, urz: urzadzenia().length };
}

function pasujeZal(o) {

  if (f.stan === 'odeszli') { if (o.status !== 'odeszla') return false; }
  else if (o.status === 'odeszla' && f.stan !== 'urzadzenia') return false;
  if (f.zesp !== 'wszyscy' && !wZespole(o, f.zesp)) return false;
  if (f.stan === 'konto' && !(o.konto && aktywna(o))) return false;
  if (f.stan === 'bez' && o.konto) return false;
  if (f.stan === 'zablokowani' && o.status !== 'zablokowana') return false;
  if (f.stan === 'karta' && !doKarty(o)) return false;
  if (f.stan === 'pin' && !((o.prosba_pin && aktywna(o)) || pinDoWymiany(o))) return false;
  if (f.modul !== 'wszystkie') {
    const [m, r] = f.modul.split(':');
    if (!o.dostepy || !o.dostepy[m]) return false;
    if (r && o.dostepy[m].rola !== r && !(o.dostepy[m].dodatkowe || []).includes(r)) return false;
  }
  if (f.szukaj) {
    const q = bezOgonkow(f.szukaj).trim();
    const w = bezOgonkow(`${o.imie} ${o.nazwisko} ${o.kafelek || ''} ${o.login || ''} ${(o.stare || []).map(x => x.login).join(' ')} ${nazwaSt(o)} ${ZESPOLY[o.zespol] ? ZESPOLY[o.zespol].nazwa : ''} ${dodZesp(o).map(z => ZESPOLY[z].nazwa).join(' ')}`);
    if (!q.split(/\s+/).every(cz => w.includes(cz))) return false;
  }
  return true;
}

function zmienDost(d, m, akcja, el, o) {
  const mod = MODUL[m];
  if (akcja === 'przel') {
    if (d[m]) delete d[m];
    else {
      const role = roleDla(o, mod);
      const pierwsza = role.find(r => !r.wysoka) || role[0];
      if (!pierwsza) return;
      d[m] = { rola: pierwsza.id, sekcje: mod.sekcje ? D.sekcje.slice() : [] };
    }
  } else if (akcja === 'rola') {
    const r = el.dataset.r;
    const zal = x => ROLA[m] && ROLA[m][x] && !ROLA[m][x].wysoka;   // rola załogi (nie szef/kierownik)
    if (mod.wiele_rol && zal(r) && d[m] && zal(d[m].rola)) {      // kilka spisów jednej osoby (006)
      const v = d[m]; const wyb = new Set([v.rola, ...(v.dodatkowe || [])]);
      if (wyb.has(r)) {
        if (wyb.size === 1) { toast('oczko', 'ZDZISŁAW PODPOWIADA', m === 'magazyn' ? 'Choć jeden spis musi zostać — cały moduł wyłączysz przełącznikiem.' : 'Choć jedna rola musi zostać — cały moduł wyłączysz przełącznikiem.'); return; }
        wyb.delete(r);
      } else wyb.add(r);
      const kol = mod.role.map(x => x.id).filter(x => wyb.has(x));
      v.rola = wyb.has(v.rola) ? v.rola : kol[0];
      v.dodatkowe = kol.filter(x => x !== v.rola);
      return;
    }
    d[m] = d[m] || { sekcje: [] };
    d[m].rola = r;
    if (mod.wiele_rol) d[m].dodatkowe = [];
    if (mod.sekcje) d[m].sekcje = r === 'kierownik' ? D.sekcje.slice() : (d[m].sekcje && d[m].sekcje.length ? d[m].sekcje : D.sekcje.slice());
  } else if (akcja === 'sek') {
    const s = el.dataset.s;
    const sek = new Set(d[m].sekcje || []);
    sek.has(s) ? sek.delete(s) : sek.add(s);
    if (!sek.size) { toast('oczko', 'ZDZISŁAW PODPOWIADA', 'Choć jedna sekcja musi zostać — inaczej Tablica byłaby pusta.'); return; }
    d[m].sekcje = D.sekcje.filter(x => sek.has(x));
  }
}

  const widoczne = konta.filter(pas);

    ? 'Nie ma starych kont do przeniesienia.'

      : !(L.zatw + L.nie)
        ? `Sparowałem ${L.wsz} starych kont z kartoteką — po imionach, zdrobnieniach i rolach. ${pewne.length} ${odm(pewne.length, 'para jest pewna', 'pary są pewne', 'par jest pewnych')}.${zostalo ? ` ${zostalo} sprawdź Ty — znasz załogę lepiej niż ja.` : ''}`

  const waga = l => (l.some(k => k.stan === 'czeka' && k.pewnosc === 'brak') ? 0 : l.some(k => spr.includes(k)) ? 1 : l.some(k => k.stan === 'czeka') ? 2 : 3);

      ${kolejnosc.map(([g, l]) => g === '_brak' ? grupaBrak(l) : grupaOsoby(PO_ID[g], l)).join('') || `<div class="puste">${T('Nic tu nie ma w tym filtrze.')}</div>`}

function opcjeOsob(k, wyb) {
  const typ = k.modul === 'tablica' && k.rola === 'ekran' ? 'urzadzenie' : 'osoba';
  const wszyscy = D.osoby.filter(o => o.typ === typ && o.status !== 'odeszla' && mozeZmieniac(o)).sort((a, b) => pelne(a).localeCompare(pelne(b), 'pl'));

  return `<option value="">— wybierz osobę —</option>${kand.length ? `<optgroup label="Pasują">${kand.map(opt).join('')}</optgroup><optgroup label="Wszyscy">` : ''}${wszyscy.filter(o => !kand.includes(o)).map(opt).join('')}${kand.length ? '</optgroup>' : ''}`;
}
function rolaStarego(k) {

}
function wierszStary(k) {

  else if (k.stan === 'nie_przenos') akcje = `<span class="pill cicha">nie przenosimy</span><button class="drugi maly" data-a="prz-cofnij" data-k="${kl}">Cofnij</button>`;

    <span class="s-akcje">${akcje}</span>

function grupaOsoby(o, l) {

        ${m.id === 'tablica' ? `<p class="pod" style="margin-top:8px">${T(`Sekcje: ${D.sekcje.map(sekNazwa).join(' i ')}. Kokpit to konto urządzenia — nie osoba.`)}</p>` : ''}

/* ───────────── okna ───────────── */
function renderOkno() {
  let w = document.getElementById('warstwa');
  if (!S.okno) { if (w) w.remove(); return; }
  if (!w) {
    w = document.createElement('div'); w.id = 'warstwa'; w.className = 'warstwa';
    w.addEventListener('click', e => { if (e.target === w && S.okno && S.okno.rodzaj !== 'klucz' && !S.zajety) { AKCJE.zamknij(); } });
    document.body.appendChild(w);
  }
  const ok = S.okno;
  let h = '';
  if (ok.rodzaj === 'osoba') h = `<div class="okno"><div class="okno-g"><h2>Karta osoby</h2><button class="zamknij" data-a="zamknij" aria-label="Zamknij">${ik('x')}</button></div><div class="szcz-okno">${renderOsoba(PO_ID[ok.id])}</div></div>`;
  else if (ok.rodzaj === 'nowa') h = oknoNowa(ok);
  else if (ok.rodzaj === 'klucz') h = oknoKlucz(ok);
  else if (ok.rodzaj === 'blokada') h = oknoBlokada(ok);
  else if (ok.rodzaj === 'dane') h = oknoDane(ok);
  else if (ok.rodzaj === 'pin-pyt') h = oknoPinPyt(ok);
  else if (ok.rodzaj === 'karty-pyt') h = oknoKartyPyt(ok);
  const sc = w.firstElementChild ? w.firstElementChild.scrollTop : 0;
  const tenSam = renderOkno.ostatnie === ok;
  renderOkno.ostatnie = ok;
  w.innerHTML = h;
  if (w.firstElementChild) { if (tenSam) w.firstElementChild.classList.add('statyczne'); w.firstElementChild.scrollTop = sc; }
}

    </div>
    ${urz ? '' : `<div class="pole"><label class="etykieta" for="n-kaf">Imię na kafelku — nieobowiązkowe</label><input id="n-kaf" data-w="n-kaf" value="${esc(f.kafelek)}" autocomplete="off" placeholder="np. Kasia — tak ją wita ZDZISŁAW"><span class="pomoc">${T('Imię pełne idzie do loginu; to krótsze widać na kafelku i w powitaniach.')}</span></div>

    </div>

  zablokuj: el => {
    const id = el.dataset.id;
    if (ja() && id === ja().id) { toast('oczko', 'ZDZISŁAW PILNUJE', 'Nie zablokujesz samego siebie — to jak zamknąć klucze w samochodzie.'); return; }
    S.okno = { rodzaj: 'blokada', id, powod: '', drugi: false, wroc: S.okno && S.okno.rodzaj === 'osoba' ? S.okno : null }; render();
  },
  'bl-powod': el => { S.okno.powod = el.dataset.v; S.okno.drugi = false; render(); },
  'bl-tak': async () => {
    if (!S.okno.drugi) { S.okno.drugi = true; render(); return; }
    const { id, powod, wroc } = S.okno;
    const akcja = powod === 'Odejście z pracy' ? 'odeszla' : 'blokuj';
    const r = await wykonaj(() => API.blokada(akcja, id, powod));
    if (!r) return;
    podmienOsobe(r.osoba); zapomnijHistorie(id); S.ed = null;
    S.okno = wroc && window.innerWidth <= 980 ? wroc : null;
    if (akcja === 'odeszla' && S.zal.osoba === id && S.zal.stan !== 'odeszli') S.zal.stan = 'odeszli';
    render();
    toast('blokada', 'ZABLOKOWANO WSZĘDZIE', `${pelne(r.osoba)} nie zaloguje się już ${r.konta ? `(${r.konta} ${odm(r.konta, 'konto', 'konta', 'kont')})` : ''}. Otwarte sesje wygasną najpóźniej w godzinę. Dostępy czekają na przywrócenie.${r.uwaga ? ' ' + r.uwaga : ''}`);
    odswiezStanCicho();
  },
  odblokuj: async el => {
    const id = el.dataset.id;
    const r = await wykonaj(() => API.blokada('odblokuj', id));
    if (!r) return;
    podmienOsobe(r.osoba); zapomnijHistorie(id);
    if (S.zal.osoba === id && (S.zal.stan === 'odeszli' || S.zal.stan === 'zablokowani')) S.zal.stan = 'wszyscy';
    render();
    toast('ok', 'DOSTĘP PRZYWRÓCONY', `${pelne(r.osoba)} znów ma dostęp — te same moduły co przed blokadą.${r.uwaga ? ' ' + r.uwaga : ''}`);
    odswiezStanCicho();
  },
  /* dane osoby */
  'edytuj-dane': el => {
    const o = PO_ID[el.dataset.id];
    S.okno = { rodzaj: 'dane', id: o.id, blad: '', f: { imie: o.imie, nazwisko: o.nazwisko, kafelek: o.kafelek || '', zespol: o.zespol, dodatkowe: dodZesp(o), stanowisko: o.stanowisko || '', jezyk: o.jezyk, notatka: o.notatka || '', login: o.login }, wroc: S.okno && S.okno.rodzaj === 'osoba' ? S.okno : null };
    render();
  },
  'd-zesp': el => { ustawZespol(S.okno.f, el.dataset.v); render(); },
  'zesp-dod': el => {   // „pracuje też w” — w oknie Dane i Nowa osoba
    const f = S.okno.f; const z = el.dataset.v; const d = f.dodatkowe || [];
    f.dodatkowe = KOL_ZESP.filter(x => x !== f.zespol && (x === z ? !d.includes(z) : d.includes(x)));
    render();
  },
  'd-jez': el => { S.okno.f.jezyk = el.dataset.v; render(); },
  'd-zapisz': async () => {
    const ok = S.okno; const o = PO_ID[ok.id]; const f = ok.f;
    const p = { id: o.id };
    if (o.typ === 'system') p.notatka = f.notatka;
    else {
      if (!f.imie.trim() || !f.nazwisko.trim()) { ok.blad = 'Imię i nazwisko nie mogą być puste.'; render(); potrzasnij(); return; }
      Object.assign(p, { imie: f.imie, nazwisko: f.nazwisko, zespol: f.zespol, notatka: f.notatka });
      if (o.typ === 'osoba') Object.assign(p, { kafelek: f.kafelek, stanowisko: f.stanowisko || '', jezyk: f.jezyk, zespoly_dodatkowe: (f.dodatkowe || []).filter(z => z !== f.zespol) });
      if (!o.konto && f.login.trim() && f.login.trim() !== o.login) p.login = f.login.trim();
    }
    const r = await wykonaj(() => API.zapiszOsobe(p), true);
    if (!r) return;
    podmienOsobe(r); zapomnijHistorie(o.id);
    S.okno = ok.wroc; render();
    toast('ok', 'ZAPISANE', `${pelne(r)} — dane zapisane.`);
    odswiezStanCicho();
  },
  /* nowa osoba / urządzenie */
  'nowa-osoba': () => otworzNowa('osoba'),
  'nowe-urzadzenie': () => otworzNowa('urzadzenie'),
  'n-st': el => { const f = S.okno.f; const st = STANOWISKA[el.dataset.v]; f.stanowisko = el.dataset.v; ustawZespol(f, st.zespol); f.konto = st.konto; f.dostepy = kopiaDost(st.dostepy); render(); },
  'n-zesp': el => { ustawZespol(S.okno.f, el.dataset.v); render(); },
  'n-jez': el => { S.okno.f.jezyk = el.dataset.v; render(); },
  'n-konto': el => { S.okno.f.konto = el.dataset.v === '1'; render(); },
  'n-przel': el => { const f = S.okno.f; zmienDost(f.dostepy, el.dataset.m, 'przel', el, f); render(); },
  'n-rola': el => { const f = S.okno.f; zmienDost(f.dostepy, el.dataset.m, 'rola', el, f); render(); },
  'n-sek': el => { const f = S.okno.f; zmienDost(f.dostepy, el.dataset.m, 'sek', el, f); render(); },
  'n-zapisz': async () => {
    const ok = S.okno; const f = ok.f; const b = {};
    const urz = f.typ === 'urzadzenie';
    if (!f.imie.trim()) b.imie = urz ? 'Wpisz nazwę.' : 'Wpisz imię.';
    if (!f.nazwisko.trim()) b.nazwisko = urz ? 'Wpisz miejsce.' : 'Wpisz nazwisko.';
    if (f.loginRecz && f.login && !/^[A-Z][A-Za-z0-9]{2,29}$/.test(f.login)) b.login = 'Login: litery i cyfry, zaczyna się wielką literą (np. AnnaNo).';
    ok.bledy = b; ok.blad = '';
    if (f.konto && !ileDost(f.dostepy)) ok.blad = 'Konto bez żadnego dostępu nic nie otworzy — włącz choć jeden moduł albo wybierz „Tylko w kartotece”.';
    if (Object.keys(b).length || ok.blad) { render(); potrzasnij(); return; }
    const p = { typ: f.typ, imie: f.imie, nazwisko: f.nazwisko, zespol: f.zespol, dostepy: f.dostepy };
    if (!urz) Object.assign(p, { kafelek: f.kafelek, stanowisko: f.stanowisko || '', jezyk: f.jezyk, zespoly_dodatkowe: (f.dodatkowe || []).filter(z => z !== f.zespol) });
    if (f.loginRecz && f.login) p.login = f.login;
    S.zajety = true; render();
    let o;
    try { o = await API.zapiszOsobe(p); }
    catch (e) {
      S.zajety = false;
      if (e && e.sesja) { sesjaWygasla(); return; }
      const bp = bladPola(e);
      if (bp) ok.bledy[bp[0]] = bp[1]; else ok.blad = tekstBledu(e);
      render(); potrzasnij(); return;
    }
    podmienOsobe(o); S.zal.osoba = o.id;
    if (!f.konto) {
      S.zajety = false; S.okno = null; render();
      toast('ok', 'W KARTOTECE', `${pelne(o)} jest już w kartotece (login ${o.login}). Konto i PIN dołożysz, gdy będą potrzebne.`);
      odswiezStanCicho(); return;
    }
    try {
      const r = await API.pin(o.id);
      S.zajety = false;
      podmienOsobe(r.osoba);
      S.okno = { rodzaj: 'klucz', id: o.id, login: r.login, pin: r.pin, nowe: true };
      render();
    } catch (e) {
      S.zajety = false;
      if (e && e.sesja) { sesjaWygasla(); return; }
      S.okno = null; render();
      toast('zebatki', 'OSOBA ZAPISANA, KONTA JESZCZE NIE MA', `${pelne(o)} jest w kartotece, ale konto się nie założyło: ${e && e.gotowy ? e.message : tekstBledu(e)} Spróbuj „Załóż konto” na karcie osoby.`);
    }
    odswiezStanCicho();
  },
  /* Dzień Kart */
  'karty-tryb': () => { S.karty.wszyscy = !S.karty.wszyscy; render(); },
  'karty-wszystkie': () => { const l = kandydaciKart(); const z = S.karty.zazn; if (z.size === l.length) z.clear(); else l.forEach(o => z.add(o.id)); render(); },
  'karty-przygotuj': () => { if (S.karty.zazn.size) { S.okno = { rodzaj: 'karty-pyt' }; render(); } },
  'karty-tak': async () => {
    S.okno = null;
    const ids = Array.from(S.karty.zazn);
    const karty = [], bledy = [];
    S.karty.robi = `Przygotowuję… 0/${ids.length}`; render();
    try {
      for (let i = 0; i < ids.length; i += 20) {
        const r = await API.karty(ids.slice(i, i + 20));
        for (const k of r.karty || []) { podmienOsobe(k.osoba); zapomnijHistorie(k.osoba.id); karty.push({ osoba: k.osoba, login: k.login, pin: k.pin }); }
        for (const b of r.bledy || []) bledy.push(b);
        S.karty.robi = `Przygotowuję… ${Math.min(i + 20, ids.length)}/${ids.length}`; render();
      }
    } catch (e) {
      if (e && e.sesja) { S.karty.robi = false; sesjaWygasla(); return; }
      bledy.push({ osoba: null, blad: e && e.gotowy ? e.message : tekstBledu(e) });
    }
    S.karty.robi = false;
    S.karty.zazn.clear();
    if (karty.length) S.karty.arkusz = { karty, bledy };
    render(); const t = $('#tresc'); if (t) t.scrollTop = 0;
    if (karty.length) toast('oczko', 'KARTY GOTOWE', `Wylosowałem ${karty.length} ${odm(karty.length, 'PIN', 'PIN-y', 'PIN-ów')}. Pokażę je tylko tutaj — wydrukuj i rozdaj do ręki.`);
    else toast('zebatki', 'HMM…', `Nie przygotowałem żadnej karty. ${bledy.map(b => b.blad).join(' ')}`);
    odswiezStanCicho();
  },
  'karty-drukuj': () => drukuj(S.karty.arkusz.karty),
  'karty-gotowe': () => {
    const n = S.karty.arkusz.karty.length;
    S.karty.arkusz = null; render();
    toast('duma_karty', 'KARTY WYDANE', `${n} ${odm(n, 'osoba ma', 'osoby mają', 'osób ma')} nowy klucz. PIN-y zniknęły z ekranu — zostały tylko na kartach.`);
  },
  'kopiuj-wiad': () => kopiuj(WIADOMOSC, () => toast('ok', 'SKOPIOWANE', 'Wiadomość jest w schowku — wklej ją na grupę WhatsApp.')),
  /* Przejście */
  'prz-filtr': el => { S.prz.filtr = el.dataset.v; render(); },
  'prz-odswiez': () => { S.prz.konta = null; render(); },
  'prz-pewne': async () => {
    const r = await wykonaj(() => API.pewne());
    if (!r) return;
    S.prz.konta = r.konta || S.prz.konta; D.przejscie = r.licz || D.przejscie; S.hist = {};
    try { await odswiezStan(); } catch (e) { if (e && e.sesja) { sesjaWygasla(); return; } }
    render();
    const n = r.zatwierdzone_teraz || 0;
    const zost = S.prz.konta.filter(k => k.stan === 'czeka').length;
    toast(zost ? 'ok' : 'duma', 'ZATWIERDZONE', `${n} ${odm(n, 'stare konto połączone', 'stare konta połączone', 'starych kont połączonych')} z osobami, dostępy dołożone.${zost ? ` Zostało ${zost} do decyzji — tu potrzebny człowiek.` : ' Wszystko gotowe do przełączenia modułów.'}`);
  },
  'prz-zatw': el => { const k = kluczDo(el); if (!k) return; const o = S.prz.wyb[el.dataset.k] || k.osoba; if (!o) { toast('zebatki', 'HMM…', 'Najpierw wybierz osobę z listy.'); return; } decyzja(k, 'zatwierdzone', o); },
  'prz-nie': el => { const k = kluczDo(el); if (k) decyzja(k, 'nie_przenos', null); },
  'prz-cofnij': el => { const k = kluczDo(el); if (k) decyzja(k, 'czeka', null); },
  /* dziennik */
  'dz-filtr': el => { S.dz.filtr = el.dataset.v; render(); },
  'dz-wiecej': async () => {
    if (S.dz.laduje) return;
    const lista = wpisyDziennika();
    const przed = lista.length ? Math.min(...lista.map(w => w.id)) : null;
    S.dz.laduje = true; render();
    try {
      const r = await API.dziennik(przed, null, 100);
      S.dz.starsze = S.dz.starsze.concat(r || []);
      if (!r || r.length < 100) S.dz.koniec = true;
    } catch (e) { if (e && e.sesja) { S.dz.laduje = false; sesjaWygasla(); return; } toast('zebatki', 'HMM…', tekstBledu(e)); }
    S.dz.laduje = false; render();
  },
  /* import z pliku Z */
  'imp-odswiez': () => { S.imp = null; render(); },
  'imp-wszystkie': () => { const nowi = S.imp.osoby.filter(o => !o.jest); const z = S.imp.zazn; if (nowi.every(o => z.has(o.etykieta))) z.clear(); else nowi.forEach(o => z.add(o.etykieta)); render(); },
  'imp-zesp': el => { S.imp.zesp[el.dataset.e] = el.dataset.v; render(); },
  'imp-ustaw': el => { for (const e of S.imp.zazn) S.imp.zesp[e] = el.dataset.v; render(); toast('ok', 'ZESPÓŁ USTAWIONY', `${S.imp.zazn.size} ${odm(S.imp.zazn.size, 'osoba', 'osoby', 'osób')} → ${ZESPOLY[el.dataset.v].nazwa}.`); },
  'imp-dodaj': async () => {
    const im = S.imp;
    const lista = im.osoby.filter(o => !o.jest && im.zazn.has(o.etykieta)).map(o => ({ imie: o.imie, nazwisko: o.nazwisko, zespol: im.zesp[o.etykieta] || 'F' }));
    if (!lista.length) return;
    const r = await wykonaj(() => API.importZ(lista, im.plik));
    if (!r) { render(); return; }
    im.wynik = r;
    try { await odswiezStan(); } catch (e) { if (e && e.sesja) { sesjaWygasla(); return; } }
    S.prz.konta = null;
    S.imp = { ...im, wynik: r };
    await wczytajListeZ();
    wczytajPrzejscie();          // nowe osoby → nowe pary w Przejściu (licznik w nawigacji)
    render(); const t = $('#tresc'); if (t) t.scrollTop = 0;
    toast('duma', 'ZAŁOGA W KARTOTECE', `Dodałem ${r.dodane} ${odm(r.dodane, 'osobę', 'osoby', 'osób')}.${r.bledne && r.bledne.length ? ` Pominąłem ${r.bledne.length} z błędami: ${r.bledne.join(', ')}.` : ''} Następny krok: Przejście — połączę stare konta.`);
  },
  zamknij: () => { if (S.zajety) return; if (S.okno && S.okno.rodzaj === 'osoba') S.ed = null; S.okno = S.okno && S.okno.wroc ? S.okno.wroc : null; render(); },
  'toast-zamknij': () => { document.getElementById('toast').classList.remove('widac'); },
};

/* ───────────── zdarzenia ───────────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (S.menu && !e.target.closest('#menu') && !(el && el.dataset.a === 'menu')) { S.menu = false; renderMenu(); const mb = $('.menu-btn'); if (mb) mb.setAttribute('aria-expanded', 'false'); if (!el) return; }
  if (!el || el.disabled) return;
  const f = AKCJE[el.dataset.a];
  if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('input', e => {
  const el = e.target; const w = el.dataset && el.dataset.w;
  if (!w) return;
  if (w === 'szukaj') { S.zal.szukaj = el.value; renderListaZal(); }
  else if (w === 'login') { S.loginInny = el.value; }
  else if (w === 's-imie') S.startF.imie = el.value;
  else if (w === 's-nazw') S.startF.nazwisko = el.value;
  else if (w === 's-kaf') S.startF.kafelek = el.value;
  else if (w === 'n-imie' || w === 'n-nazw') { S.okno.f[w === 'n-imie' ? 'imie' : 'nazwisko'] = el.value; podpowiedzLogin(); }
  else if (w === 'n-login') { S.okno.f.login = el.value.trim(); S.okno.f.loginRecz = el.value.trim() !== ''; if (!S.okno.f.loginRecz) podpowiedzLogin(); }
  else if (w === 'n-kaf') S.okno.f.kafelek = el.value;
  else if (w === 'd-imie') S.okno.f.imie = el.value;
  else if (w === 'd-nazw') S.okno.f.nazwisko = el.value;
  else if (w === 'd-kaf') S.okno.f.kafelek = el.value;
  else if (w === 'd-not') S.okno.f.notatka = el.value;
  else if (w === 'd-login') S.okno.f.login = el.value;
});
document.addEventListener('change', e => {
  const el = e.target; const w = el.dataset && el.dataset.w;
  if (w === 'f-modul') { S.zal.modul = el.value; renderListaZal(); }
  else if (w === 'karta-zazn') { el.checked ? S.karty.zazn.add(el.dataset.id) : S.karty.zazn.delete(el.dataset.id); render(); }
  else if (w === 'prz-osoba') { S.prz.wyb[el.dataset.k] = el.value || null; render(); }
  else if (w === 'd-st') S.okno.f.stanowisko = el.value;
  else if (w === 'imp-zazn') { el.checked ? S.imp.zazn.add(el.dataset.e) : S.imp.zazn.delete(el.dataset.e); render(); }
});
document.addEventListener('keydown', e => {
  if (S.etap === 'pin' && !S.okno) {
    if (/^\d$/.test(e.key)) { AKCJE.cyfra({ dataset: { v: e.key } }); e.preventDefault(); }
    else if (e.key === 'Backspace') { AKCJE['cofnij-cyfre'](); e.preventDefault(); }
    else if (e.key === 'Enter') { AKCJE['pin-ok'](); e.preventDefault(); }
  } else if (S.etap === 'logowanie' && e.key === 'Enter' && e.target && e.target.id === 'login-inny') { AKCJE['inna-dalej'](); }
  else if (S.etap === 'start' && e.key === 'Enter' && e.target && e.target.tagName === 'INPUT') { AKCJE['start-zapisz'](); }
  else if (e.key === 'Escape') { if (S.menu) { S.menu = false; renderMenu(); } else if (S.okno && S.okno.rodzaj !== 'klucz') { AKCJE.zamknij(); } }
});
setInterval(() => { const z = document.getElementById('zegar'); if (z) z.textContent = zegarTekst(); }, 15000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.etap === 'app' && Date.now() - D.wczytano > 5 * 60e3 && !S.okno && !S.ed) odswiezStanCicho();
});

uruchom();

</script>
</body>
</html>
